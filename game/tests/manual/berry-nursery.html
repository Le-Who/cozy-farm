<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ягодный питомник</title>
<style>body{font:15px/1.4 system-ui;background:#faf7f0;color:#352447;margin:10px}button{padding:8px;margin:3px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #999}</style>
<p>Тестовый сад: только localhost:4239. Посадка и особенность получены действиями с чистой фермы.</p>
<button id="seed">Зрелая росистая черника</button><button id="recipe">Заказ и редкий рецепт</button><button id="grow">Вырастить политые посадки</button><button id="inspect">Проверить запись</button><button id="reload">Перезагрузить</button><button data-size="360,640">360×640</button><button data-size="520,480">520×480</button><button data-size="568,320">568×320</button><button data-size="960,600">960×600</button><details id="data"><summary>Состояние</summary><pre id="result"></pre></details><iframe title="Игра для проверки" width="960" height="600"></iframe>
<script type="module">
import {berryNurseryPlayer} from '/tests/fixtures/berry-nursery-player.ts';import actions from '/tests/fixtures/home-progress-actions.json';import {farmSaveKeys} from '/src/farm-save-keys.ts';import {restoreCurrentFarm,endDay} from '/src/farm.ts';import {getShopCommissionOffers} from '/src/shop-commissions.ts';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4239';
function read(){const raw=localStorage.getItem(farmSaveKeys.primary);return raw&&restoreCurrentFarm(JSON.parse(raw))}
function inspect(){const f=read();result.textContent=JSON.stringify({valid:!!f,day:f?.day,coins:f?.coins,beds:f?.beds,water:f?.water,variants:f?.variants,commissions:f?.shopCommissions},null,2);document.querySelector('#data').open=true}
function write(f){if(!allowed)return;localStorage.removeItem(farmSaveKeys.journal);localStorage.setItem(farmSaveKeys.primary,JSON.stringify(f));frame.src='/'}
document.querySelector('#seed').onclick=()=>{if(!allowed)return;try{const n=berryNurseryPlayer(actions);n.p.state.discoveryPreferences.quiet=true;write(n.p.state);result.textContent='День 17, зрелая росистая черника, 61 монета.'}catch(e){result.textContent=String(e)}};
document.querySelector('#recipe').onclick=()=>{if(!allowed)return;try{const n=berryNurseryPlayer(actions),p=n.p;n.divide(0,2);n.grow();n.divide(0,3);n.divide(2,4);n.grow();for(const i of [0,2,3])p.act('workBed',i);const id=n.cook();n.introduce(id);p.act('acceptShopCommission',getShopCommissionOffers(p.state).find(o=>o.customer==='finn').key);for(let i=0;i<2;i++){n.cook(id);p.act('deliverShopCommission',String(p.state.shopCommissions.serial))}p.act('finishShopCommission',String(p.state.shopCommissions.serial));p.visit('home');p.state.discoveryPreferences.quiet=true;write(p.state);result.textContent='Завершён первый заказ, ягоды израсходованы, сохранена зрелая маточная посадка.'}catch(e){result.textContent=String(e)}};
document.querySelector('#grow').onclick=()=>{if(!allowed)return;const f=read();if(f){for(let i=0;i<3;i++)endDay(f);write(f)}};
document.querySelector('#inspect').onclick=inspect;document.querySelector('#reload').onclick=()=>frame.src='/';document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h});if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
</script></html>
