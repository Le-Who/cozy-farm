<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка возвращения на отмель</title><style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style><h1>Проверка возвращения на отмель</h1><p>Только loopback:5200. Существующие сохранения не заменяются.</p><label>Сценарий <select id="scenario"><option value="waiting">День 6: прилив без жемчужины</option><option value="collected">День 11: жемчужина уже собрана</option></select></label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/shoal-return-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import{createFarm,restoreFarm,collectShoalFind}from'/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';import{getShoalReturn}from'/src/shoal-return.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5200',out=document.querySelector('#result'),baseline='cozy-shoal-return-baseline';if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Только loopback:5200.';}
function stable(value){return JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b))):v)}
function changedKeys(raw){const before=JSON.parse(localStorage.getItem(baseline)||'{}'),after=JSON.parse(raw||'{}');return Object.keys(after).filter(key=>stable(after[key])!==stable(before[key]));}
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),changedFields:changedKeys(raw),day:f.day,island:f.island,coins:f.coins,workToday:f.workToday,progress:f.progress,fishCaughtToday:f.fishCaughtToday,finds:f.shoalFinds,discovered:f.shoalDiscoveries,collected:f.shoalCollectedToday,glass:getShoalReturn(f,'glass'),pearl:getShoalReturn(f,'pearl')},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Сохранение уже есть. Оно не заменено.';return;}const f=createFarm();f.day=6;f.boatOwned=true;f.island='grove';f.shellDiscoveries=['regular','moon'];f.orientation={collections:true,islands:true};f.discoveryPreferences.quiet=true;if(document.querySelector('#scenario').value==='collected'){f.day=11;collectShoalFind(f,'pearl');}if(!restoreFarm(f))throw Error('Некорректная ферма');const raw=JSON.stringify(restoreFarm(f));localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show();});document.querySelector('#inspect').addEventListener('click',()=>{if(allowed)show();});
</script></html>
