<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ручная упаковка яиц</title>
<style>body{max-width:1000px;margin:6px auto;padding:6px;background:#faf7f0;color:#352447;font:16px/1.4 system-ui}button{margin:3px;padding:7px;font:inherit}pre{white-space:pre-wrap;font-size:12px;margin:4px 0}iframe{border:1px solid #888;max-width:100%}</style>
<h1 style="font-size:18px;margin:4px">Ручная упаковка яиц</h1><p>Только localhost:4208. Синтетическая ферма, 16 обычных яиц, упаковочная.</p><button id="fixture">Подготовить упаковочную</button><button id="inspect">Проверить сохранение</button><button data-size="360,640">360×640</button><button data-size="390,844">390×844</button><button data-size="568,320">568×320</button><button data-size="844,390">844×390</button><pre role="status">Сохранение не изменено.</pre><div id="frame"></div>
<script type="module">
import {physicalPackingFixture} from '../fixtures/physical-packing.ts'
import {restoreFarm} from '/src/farm.ts'
import {farmSaveKeys} from '/src/farm-save-keys.ts'
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4208',out=document.querySelector('pre')
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Запись разрешена только на localhost:4208.'}
function show(f){out.textContent=JSON.stringify({valid:!!restoreFarm(f),day:f.day,island:f.island,coins:f.coins,eggs:f.eggs,baskets:f.eggBaskets,crates:f.eggCrates,workToday:f.workToday,coop:f.buildingLevels.coop,specialization:f.coopSpecialization,variants:f.variants})}
document.getElementById('fixture').addEventListener('click',()=>{if(!allowed)return;document.getElementById('frame').innerHTML='';const farm=physicalPackingFixture();localStorage.removeItem('cozy-farm-community-selection-v1');localStorage.setItem(farmSaveKeys.primary,JSON.stringify(farm));show(farm)})
document.getElementById('inspect').addEventListener('click',()=>{if(!allowed)return;const f=restoreFarm(JSON.parse(localStorage.getItem(farmSaveKeys.primary)??'null'));if(f)show(f);else out.textContent='Нет корректного сохранения.'})
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{if(!allowed)return;const [w,h]=b.dataset.size.split(',');document.getElementById('frame').innerHTML=`<iframe title="Игра" src="/" width="${w}" height="${h}"></iframe>`}))
</script></html>
