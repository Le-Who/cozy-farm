<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка пути к редкой рыбе</title><style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style><h1>Проверка пути к редкой рыбе</h1><p>Только loopback:5203 или 5204. Существующие сохранения не заменяются. Кухня открыта, лодки нет.</p><label>Квота дома <select id="quota"><option value="0">Осталось 3 рыбы</option><option value="3">Улов на сегодня собран</option></select></label><label><input id="bonus" type="checkbox"> Подготовленная рыбалка, помощь Финна и пикник</label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/fish-guidance-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import{createFarm,restoreFarm}from'/src/farm.ts';import{neighborHelpFixture}from'/tests/fixtures/neighbor-help.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';import{getFishSource}from'/src/fish-guidance.ts';import{getRequirementHint}from'/src/requirement-guidance.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&['5203','5204'].includes(location.port),out=document.querySelector('#result'),baseline='cozy-fish-guidance-baseline';if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Только loopback:5203 или 5204.';}
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,island:f.island,boat:f.boatOwned,coins:f.coins,workToday:f.workToday,progress:f.progress,fishCaughtToday:f.fishCaughtToday,fish:f.fish,pending:f.pendingFishingTrip,serial:f.fishingTripSerial,scouting:f.village.scouting,picnic:f.culinary.picnic,finnHelp:f.neighbors.finn.helpReady,source:getFishSource(f,'moonfish'),hint:getRequirementHint(f,{kind:'stock',item:{kind:'fish',item:'moonfish',quantity:1}})},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Сохранение уже есть. Оно не заменено.';return;}const bonus=document.querySelector('#bonus').checked,f=bonus?neighborHelpFixture():createFarm();f.day=5;f.island='home';f.boatOwned=false;f.coins=18;if(!bonus)f.buildingLevels.farmhouse=2;f.fishCaughtToday.home=Number(document.querySelector('#quota').value);f.fruit.apple=1;if(bonus){f.village.scouting=true;f.village.serviceOn.finn=f.day;f.culinary.picnic={day:5,processing:'bright'};}f.orientation={collections:true,islands:true};f.discoveryPreferences.quiet=true;const checked=restoreFarm(f);if(!checked)throw Error('Некорректная ферма');const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show();});document.querySelector('#inspect').addEventListener('click',()=>{if(allowed)show();});
</script></html>
