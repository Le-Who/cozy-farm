<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Растущий редкий ингредиент</title><h1>Растущий редкий ингредиент</h1><p>Только loopback:5220/5221. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><button id="watered">Создать политую ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm}from'/src/farm.ts';import{growingVariantFixture}from'../fixtures/growing-variant.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&['5220','5221'].includes(location.port),out=document.querySelector('pre'),baseline='cozy-growing-variant-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,coins:f.coins,work:f.workToday,beds:f.beds,water:f.water,produce:f.produce,variants:f.variants,fruit:f.fruit,recipes:f.culinary.recipes.map(r=>({id:r.id,name:r.name,batches:r.batches})),stock:f.culinary.stock},null,2):'Нет корректной фермы.';}
function create(watered=false){if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const checked=growingVariantFixture(watered);const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#create').onclick=()=>create();document.querySelector('#watered').onclick=()=>create(true);document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
