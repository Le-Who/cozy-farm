<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка утренней кладки</title>
<style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style>
<h1>Проверка утренней кладки</h1><p>Синтетическая ферма только на localhost:5197. Создание разрешено лишь при отсутствии сохранения. Эта страница не заменяет существующую ферму.</p>
<label>Сценарий <select id="scenario"><option value="full">Полные гнёзда</option><option value="hatch">Вылупление завтра</option></select></label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/coop-preview-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import {createFarm,restoreFarm,getCoopMorning} from '/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5197',output=document.querySelector('#result'),baseline='cozy-coop-preview-baseline';
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);output.textContent='Проверка разрешена только на localhost:5197.';}
function summary(farm,raw){return{valid:!!restoreFarm(farm),saveBytesUnchanged:raw===localStorage.getItem(baseline),day:farm.day,coins:farm.coins,workToday:farm.workToday,fishCaughtToday:farm.fishCaughtToday,preferences:farm.discoveryPreferences,flockSize:farm.flockSize,hatchDay:farm.hatchDay,chickenHappiness:farm.chickenHappiness,eggTrait:farm.eggTrait,feed:farm.feed,chickensFed:farm.chickensFed,eggsReady:farm.eggsReady,eggs:farm.eggs,variants:farm.variants,progress:farm.progress,preview:getCoopMorning(farm)};}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){output.textContent='Сохранение уже есть. Оно не заменено.';return;}const farm=createFarm();farm.day=3;farm.beds=farm.beds.map(()=>({kind:'empty'}));farm.eggsReady=6;farm.eggTrait='rainbow';farm.progress.feed=1;farm.progress.collect=1;farm.fishCaughtToday.home=3;farm.fishCaughtToday.grove=3;if(document.querySelector('#scenario').value==='hatch'){farm.buildingLevels.coop=3;farm.coopSpecialization='hatchery';farm.eggsReady=8;farm.hatchDay=4;farm.chickensFed=true;farm.discoveryPreferences.quiet=true;}const raw=JSON.stringify(farm);if(!restoreFarm(farm))throw Error('Некорректная проверочная ферма');localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);output.textContent=JSON.stringify(summary(farm,raw),null,2);});
document.querySelector('#inspect').addEventListener('click',()=>{if(!allowed)return;const raw=localStorage.getItem(farmSaveKeys.primary),farm=raw&&restoreFarm(JSON.parse(raw));output.textContent=farm?JSON.stringify(summary(farm,raw),null,2):'Сохранение не найдено или не прошло проверку.';});
</script></html>
