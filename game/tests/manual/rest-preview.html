<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка прогноза огорода</title>
<style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style>
<h1>Проверка прогноза огорода</h1><p>Синтетическая ферма только на localhost:5196. Создание разрешено лишь при отсутствии сохранения. Эта страница не заменяет существующую ферму.</p>
<button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/rest-preview-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import {createFarm,restoreFarm} from '/src/farm.ts';import{getClimate}from'/src/climate.ts';import{getRestPreview}from'/src/rest-preview.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5196',output=document.querySelector('#result'),baseline='cozy-rest-preview-baseline';
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);output.textContent='Проверка разрешена только на localhost:5196.';}
function summary(farm,raw){return{valid:!!restoreFarm(farm),saveBytesUnchanged:raw===localStorage.getItem(baseline),day:farm.day,coins:farm.coins,workToday:farm.workToday,fishCaughtToday:farm.fishCaughtToday,progress:farm.progress,beds:farm.beds.slice(0,4),preview:getRestPreview(farm)};}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){output.textContent='Сохранение уже есть. Оно не заменено.';return;}const farm=createFarm();farm.day=Array.from({length:30},(_,i)=>i+1).find(day=>getClimate(day+1).weather==='rain');farm.beds=Array.from({length:16},()=>({kind:'empty'}));farm.beds.splice(0,4,{kind:'crop',crop:'carrot',growth:0,watered:true},{kind:'crop',crop:'cabbage',growth:0,watered:true},{kind:'crop',crop:'pumpkin',growth:1,watered:false},{kind:'crop',crop:'tomato',growth:3,watered:false});farm.chickensFed=true;farm.progress.till=1;farm.progress.plant=1;farm.progress.water=1;farm.fishCaughtToday.home=3;farm.fishCaughtToday.grove=3;const raw=JSON.stringify(farm);if(!restoreFarm(farm))throw Error('Некорректная проверочная ферма');localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);output.textContent=JSON.stringify(summary(farm,raw),null,2);});
document.querySelector('#inspect').addEventListener('click',()=>{if(!allowed)return;const raw=localStorage.getItem(farmSaveKeys.primary),farm=raw&&restoreFarm(JSON.parse(raw));output.textContent=farm?JSON.stringify(summary(farm,raw),null,2):'Сохранение не найдено или не прошло проверку.';});
</script></html>
