<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Готовый редкий ингредиент</title><h1>Готовый редкий ингредиент</h1><p>Только loopback:5207. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{createFarm,restoreFarm,completeSignature}from'/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5207',out=document.querySelector('pre'),baseline='cozy-ready-variants-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,coins:f.coins,work:f.workToday,trees:f.trees.home,variants:f.variants,fruit:f.fruit,recipes:f.culinary.recipes.map(r=>({id:r.id,name:r.name,batches:r.batches})),stock:f.culinary.stock},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const f=createFarm();f.buildingLevels.farmhouse=2;f.orientation={collections:true,islands:true};f.discoveryPreferences.quiet=true;f.variants.apple={rainbow:2};completeSignature(f,{base:'preserves',ingredients:[{id:'apple',quantity:2,trait:'rainbow'}]},{family:'preserves',processing:'silky',fruit:[],steps:['stir','pour']});f.trees.home[1]={...f.trees.home[0],trait:'rainbow'};const checked=restoreFarm(f);if(!checked)throw Error('Некорректная ферма');const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
