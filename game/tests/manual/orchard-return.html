<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка возврата дерева</title><style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style><h1>Проверка возврата дерева</h1><p>Только loopback:5201. Существующие сохранения не заменяются. Молодая груша в саду, две груши в питомнике: молодая и взрослая без плодов. Садовый конфитюр требует грушу.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/orchard-return-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import{createFarm,restoreFarm}from'/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';import{getFruitSource}from'/src/orchard-guidance.ts';import{getSupplyGuidance}from'/src/discovery-path.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5201',out=document.querySelector('#result'),baseline='cozy-orchard-return-baseline';if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Только loopback:5201.';}
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,island:f.island,coins:f.coins,workToday:f.workToday,progress:f.progress,fishCaughtToday:f.fishCaughtToday,fruit:f.fruit,trees:f.trees,nursery:f.treeNursery,source:getFruitSource(f,'pear'),guidance:getSupplyGuidance(f,{kind:'fruit',item:'pear',quantity:1},'конфитюр')},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Сохранение уже есть. Оно не заменено.';return;}const f=createFarm();f.day=5;f.buildingLevels.farmhouse=3;f.farmhouseSpecialization='preserves';f.fruit.apple=1;f.trees.home[0]={tree:'pear',age:0,fruitReady:0};f.treeNursery=[{id:4,tree:{tree:'pear',age:0,fruitReady:0}},{id:7,tree:{tree:'pear',age:3,fruitReady:0}}];f.treeNurserySerial=7;f.orientation={collections:true,islands:true};f.discoveryPreferences.quiet=true;const checked=restoreFarm(f);if(!checked)throw Error('Некорректная ферма');const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show();});document.querySelector('#inspect').addEventListener('click',()=>{if(allowed)show();});
</script></html>
