<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Форма выпечки для цели</title><h1>Форма выпечки для цели</h1><p>Только loopback:5218. Существующая ферма не заменяется.</p><button id="create">Создать ферму для проекта</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm}from'/src/farm.ts';import{pastryProjectFixture}from'../fixtures/pastry-guidance.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5218',out=document.querySelector('pre'),baseline='cozy-pastry-guidance-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,island:f.island,coins:f.coins,work:f.workToday,handmade:f.handmade,patterns:f.workshopPatterns,wheat:f.produce.wheat,eggs:f.eggs,meals:f.village.meals,mealOn:f.village.mealOn},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const raw=JSON.stringify(pastryProjectFixture());localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
