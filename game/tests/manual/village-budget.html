<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Стоимость Живой бухты</title><h1>Стоимость Живой бухты</h1><p>Только loopback:5208/5209. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><button id="ready">Создать готовый проект</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm,getVillageProject}from'/src/farm.ts';import{villageBudgetFixture}from'../fixtures/village-budget.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&['5208','5209'].includes(location.port),out=document.querySelector('pre'),baseline='cozy-village-budget-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,island:f.island,coins:f.coins,work:f.workToday,built:f.village.built,supplies:f.village.supplies,round:f.handmade.round,fish:f.fish.seaBass,honey:f.honey,apple:f.fruit.apple,project:getVillageProject(f)},null,2):'Нет корректной фермы.';}
function create(ready=false){if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const checked=villageBudgetFixture(ready);const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()} document.querySelector('#create').onclick=()=>create();document.querySelector('#ready').onclick=()=>create(true);document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
