<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка упакованных яиц</title>
<style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style>
<h1>Проверка упакованных яиц</h1><p>Проверочная ферма только на loopback:5199. Не заменяет существующее сохранение.</p><label>Упаковка <select id="kind"><option value="basket">Корзина, курятник 1</option><option value="crate">Ящик, упаковочная 3</option></select></label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/packed-eggs-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import{createFarm,restoreFarm}from'/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5199',out=document.querySelector('#result'),baseline='cozy-packed-eggs-baseline';
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Проверка разрешена только на loopback:5199.';}
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),farm=raw&&restoreFarm(JSON.parse(raw));out.textContent=farm?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:farm.day,coins:farm.coins,workToday:farm.workToday,progress:farm.progress,fishCaughtToday:farm.fishCaughtToday,eggs:farm.eggs,eggsReady:farm.eggsReady,feed:farm.feed,chickensFed:farm.chickensFed,eggBaskets:farm.eggBaskets,eggCrates:farm.eggCrates,coop:farm.buildingLevels.coop,variants:farm.variants,dishes:farm.dishes,fruit:farm.fruit},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Сохранение уже есть. Оно не заменено.';return;}const f=createFarm();f.day=3;f.fruit.apple=2;f.produce.wheat=1;f.eggs=0;f.eggsReady=0;f.chickensFed=true;f.orientation={collections:true,islands:true};f.progress={till:1,plant:1,water:1,rest:1,harvest:3,sell:1,feed:1,collect:1};f.beds=f.beds.map(()=>({kind:'empty'}));if(document.querySelector('#kind').value==='crate'){f.eggCrates=1;f.buildingLevels.coop=3;f.coopSpecialization='packing';}else f.eggBaskets=1;const raw=JSON.stringify(f);if(!restoreFarm(f))throw Error('Некорректная ферма');localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show();});
document.querySelector('#inspect').addEventListener('click',()=>{if(allowed)show();});
</script></html>
