<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Макет близкой гавани</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0;font:700 13px "Trebuchet MS",system-ui;color:#693454;background:#87c8ce}canvas{display:block;width:100%;height:100%}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #54246d;outline-offset:2px}.paper{background:linear-gradient(#fffaec,#fff0d5);border:1px solid #dca358;box-shadow:inset 0 0 0 2px #fff7e3,inset 0 0 0 4px #f6ce90,0 3px 0 #9c663b5c,0 5px 10px #41333f26;border-radius:17px}.hud{position:absolute;inset:8px 8px auto;display:flex;align-items:center;gap:4px;height:44px}.status{flex:1;padding:13px 7px;white-space:nowrap;font-size:12px}.icon{width:44px;height:44px;padding:5px}.icon img,.action img{width:100%;height:100%;object-fit:contain}.title{position:absolute;top:72px;right:8px;padding:13px 12px}nav{position:absolute;top:124px;left:8px;right:8px;display:flex;gap:4px}nav button{flex:1;min-width:0;min-height:44px;padding:7px 3px;font-size:12px;border:1px solid #c7a0ce;border-radius:12px;background:#fff0d8}nav button[aria-pressed=true]{background:#e9dbf1;border:2px solid #9b72b3;box-shadow:inset 0 0 0 1px #fff9ed}.bottom{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px}.action{width:48px;height:48px;border:1px solid #e0b27d;border-radius:12px;padding:4px;background:linear-gradient(#fff1d4,#fee2b1)}#stage{position:absolute;bottom:86px;right:8px;min-height:36px;padding:6px 10px}#availability{position:absolute;top:46%;left:8px;right:8px;text-align:center;background:#fff4df;padding:12px}output{position:absolute;bottom:89px;left:8px;font-size:11px;max-width:52%;background:#fff4dfe8;border-radius:9px;padding:5px}@media(max-width:340px){nav button{font-size:11px}}@media(orientation:landscape){nav{top:auto;bottom:82px;width:340px;right:auto}nav button{font-size:11px}.title{top:61px}.bottom{bottom:8px}output{left:8px;right:auto;bottom:132px}}
</style>
<canvas aria-label="Макет мира. Выбор вида — кнопками мест."></canvas>
<div class="hud"><div class="status paper">☀ День 10　🪙72　💧5/8</div><button class="icon paper" disabled aria-label="Рынок (макет)"><img src="/art/icons/shop.webp" alt=""></button><button class="icon paper" disabled aria-label="Запасы (макет)"><img src="/art/icons/pack.webp" alt=""></button><button class="icon paper" disabled aria-label="Карта (макет)"><img src="/art/icons/island.webp" alt=""></button></div>
<div class="title paper">Лавандовая гавань</div><nav aria-label="Виды гавани"></nav><button id="stage" class="paper">Дом: каркас</button><output aria-live="polite"></output>
<div class="bottom paper"><button class="action" disabled aria-label="Кондитерская (макет)"><img src="/art/lavender/ui-handmade-round.webp" alt=""></button><button class="action" disabled aria-label="Соседи (макет)"><img src="/art/lavender/ui-bea.webp" alt=""></button><button class="action" disabled aria-label="Лодка (макет)"><img src="/art/lavender/tool-boat.webp" alt=""></button></div><p id="availability" hidden>Для этого макета нужен WebGL2.</p>
<script type="module">
import{createWorld}from'/src/world.ts';import{createRasterLibrary}from'/src/raster.ts';import{scenePoint,sceneScale,landscape}from'/src/lavender-layout.ts';import{createVillageHomePlates,villageHomeStages}from'/src/village-home-art.ts';import{harbourStudyCamera,harbourStudyViews}from'../fixtures/harbour-camera-study.ts';
const canvas=document.querySelector('canvas'),abort=new AbortController(),world=createWorld(canvas,()=>{}),compose=createVillageHomePlates();let selected='overview',stage=0;const art=createRasterLibrary(()=>paint(),abort.signal);document.querySelector('#availability').hidden=world.available;
function paint(){const w=innerWidth,h=innerHeight,view=harbourStudyCamera(w,h,selected);world.resize(w,h,devicePixelRatio,view.scale,view.center);world.begin();const base=art.image('plate');if(base){const patch=stage<2?art.image(villageHomeStages[stage].key):undefined;world.plate(compose(base,patch),landscape.village.bounds);world.water.setShore(base,{x:w/2+(landscape.village.bounds.x-view.center.x)*view.scale,y:h/2+(landscape.village.bounds.y-view.center.y)*view.scale,w:landscape.village.bounds.w*view.scale,h:landscape.village.bounds.h*view.scale},h/2+(landscape.village.shoreY-view.center.y)*view.scale)}world.water.paint(0);
for(const p of[{key:'pergola',x:790,y:381,w:210,h:195},{key:'pavilion',x:1195,y:513,w:151,h:155}]){const a=scenePoint(p.x,p.y);world.shape('shade',a.x,a.y-3,p.w*sceneScale*.35,p.h*sceneScale*.065,'#686044',.14);art.draw(world,p.key,a.x,a.y,p.w*sceneScale,p.h*sceneScale,{mipmaps:true,baseline:.98,footY:a.y})}
for(const p of[{key:'bea',x:632,y:419},{key:'finn',x:1222,y:561}]){const a=scenePoint(p.x,p.y);art.draw(world,p.key,a.x,a.y,110,110,{frame:0,fullCell:true,baseline:236/256,footY:a.y})}
const farmer=scenePoint(367,739);art.draw(world,'farmer',farmer.x,farmer.y,105*224/160,105,{frame:0,fullCell:true,baseline:.9,footY:farmer.y});world.render();document.querySelector('output').textContent=`${view.close?'Близкий вид':'Обзор'} · ×${(view.scale/Math.min(w/1440,h/900)).toFixed(2)}`;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===selected)))}
document.querySelector('nav').innerHTML=harbourStudyViews.map(v=>`<button type="button" data-view="${v.id}" aria-pressed="${v.id===selected}">${v.label}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{selected=b.dataset.view;paint()});document.querySelector('#stage').onclick=()=>{stage=(stage+1)%3;document.querySelector('#stage').textContent=`Дом: ${['каркас','отделка','готов'][stage]}`;paint()};addEventListener('resize',paint);addEventListener('pagehide',()=>{abort.abort();world.dispose()},{once:true});
art.load('plate','lavender/village-plate');for(const s of villageHomeStages)art.load(s.key,s.path);art.load('pergola','lavender/bay/pergola',[1,1]);art.load('pavilion','lavender/bay/pavilion',[1,1]);art.load('bea','lavender/village-bea',[6,1]);art.load('finn','lavender/village-finn',[6,1]);art.load('farmer','lavender/farmer-actions',[6,1]);paint();
</script></html>
