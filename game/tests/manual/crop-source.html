<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Ближайший урожай для кухни</title><h1>Ближайший урожай для кухни</h1><p>Только loopback:5210. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm}from'/src/farm.ts';import{cropSourceFixture}from'../fixtures/crop-source.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5210',out=document.querySelector('pre'),baseline='cozy-crop-source-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,island:f.island,coins:f.coins,water:f.water,work:f.workToday,beds:f.beds,produce:f.produce,eggs:f.eggs,progress:f.progress},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const raw=JSON.stringify(cropSourceFixture());localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
