<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Готовый редкий ингредиент</title><h1>Готовый редкий ингредиент</h1><p>Только loopback:5219. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm}from'/src/farm.ts';import{nurseryVariantFixture}from'../fixtures/nursery-variant.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5219',out=document.querySelector('pre'),baseline='cozy-nursery-variant-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,coins:f.coins,work:f.workToday,trees:f.trees.home,nursery:f.treeNursery,variants:f.variants,fruit:f.fruit,recipes:f.culinary.recipes.map(r=>({id:r.id,name:r.name,batches:r.batches})),stock:f.culinary.stock},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const checked=nurseryVariantFixture();const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
