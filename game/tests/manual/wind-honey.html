<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Точный день мёда ветров</title><h1>Точный день мёда ветров</h1><p>Только loopback:5212. Существующая ферма не заменяется.</p><label>Начальный игровой день <select id="day"><option>9</option><option>12</option></select></label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm,getCapeHoney}from'/src/farm.ts';import{windHoneyFixture}from'../fixtures/wind-honey.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5212',out=document.querySelector('pre'),baseline='cozy-wind-honey-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),onlyIslandChanged:raw===JSON.stringify({...JSON.parse(localStorage.getItem(baseline)),island:f.island}),day:f.day,island:f.island,coins:f.coins,work:f.workToday,honey:f.honey,windHoney:f.windHoney,beeswax:f.beeswax,capeHoneyOn:f.capeHoneyOn,capeLevel:f.capeLevel,harvest:getCapeHoney(f)},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const raw=JSON.stringify(windHoneyFixture(Number(document.querySelector('#day').value)));localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
