<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Осознанный выбор обустройства</title><h1>Осознанный выбор обустройства</h1><p>Только loopback:5213. Существующая ферма не заменяется.</p><label><input type="checkbox" id="scarce">Не хватает монет и яиц</label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm,getWaterCapacity}from'/src/farm.ts';import{facilityChoiceFixture}from'../fixtures/facility-choice.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5213',out=document.querySelector('pre'),baseline='cozy-facility-choice-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,coins:f.coins,work:f.workToday,water:f.water,capacity:getWaterCapacity(f),eggs:f.eggs,coop:f.coopSpecialization,well:f.wellSpecialization,hatchDay:f.hatchDay,flock:f.flockSize},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const raw=JSON.stringify(facilityChoiceFixture(document.querySelector('#scarce').checked));localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
