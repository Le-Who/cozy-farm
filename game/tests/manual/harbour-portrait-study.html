<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Камера гавани: исследование</title>
<style>body{margin:10px;background:#faf7ef;color:#513747;font:15px/1.4 system-ui}button{padding:9px;margin:3px}iframe{border:1px solid #aaa;display:block}p{max-width:940px}</style>
<header><p><strong>Исследование, не игровая сборка.</strong> Только камера и композиция на существующих ассетах. Сохранения не читаются и не записываются. Кнопки мест перемещают камеру, не игрока.</p><button data-size="390,844">390×844</button><button data-size="320,568">320×568</button><button data-size="844,390">844×390</button><button data-size="960,600">960×600</button><button id="hide">Только макет</button><p id="metrics"></p></header>
<button id="show" hidden style="position:fixed;right:12px;top:12px">Проверки</button><iframe title="Макет камеры гавани" src="./harbour-portrait-scene.html" width="390" height="844"></iframe>
<script type="module">
import{harbourStudyCamera}from'../fixtures/harbour-camera-study.ts';const frame=document.querySelector('iframe');function resize(w,h){frame.width=w;frame.height=h;const before=harbourStudyCamera(w,h,'overview'),after=harbourStudyCamera(w,h,'east');document.querySelector('#metrics').textContent=`${w}×${h}; масштаб: ${before.scale.toFixed(3)} → ${after.scale.toFixed(3)}; лавка: ${(151*.75*before.scale).toFixed(1)} → ${(151*.75*after.scale).toFixed(1)} px`};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>resize(...b.dataset.size.split(',').map(Number)));document.querySelector('#hide').onclick=()=>{document.querySelector('header').hidden=true;document.querySelector('#show').hidden=false};document.querySelector('#show').onclick=()=>{document.querySelector('header').hidden=false;document.querySelector('#show').hidden=true};resize(390,844);
</script></html>
