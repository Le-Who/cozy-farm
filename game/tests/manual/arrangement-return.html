<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расстановка встречи</title>
<style>body{max-width:1000px;margin:6px auto;padding:6px;background:#faf7f0;color:#352447;font:16px/1.4 system-ui}button{margin:3px;padding:7px;font:inherit}pre{white-space:pre-wrap}iframe{border:1px solid #888;max-width:100%}</style>
<h1 style="font-size:18px;margin:4px">Расстановка встречи</h1><p>Только localhost:4207. Синтетическая ферма. Выберите состояние, затем размер игры.</p><button id="fixture">Подготовить встречу Беа</button><button id="inspect">Проверить сохранение</button><button data-size="360,640">360×640</button><button data-size="390,844">390×844</button><button data-size="568,320">568×320</button><button data-size="844,390">844×390</button><pre role="status" style="font-size:12px;margin:4px 0">Сохранение не изменено.</pre><div id="frame"></div>
<script type="module">
import {neighborTastingsFixture} from '../fixtures/neighbor-tastings.ts'
import {restoreFarm} from '/src/farm.ts'
import {farmSaveKeys} from '/src/farm-save-keys.ts'
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4207',out=document.querySelector('pre')
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Запись разрешена только на localhost:4207.'}
function show(f){out.textContent=JSON.stringify({valid:!!restoreFarm(f),day:f.day,island:f.island,coins:f.coins,stock:f.culinary.stock,eggs:f.eggs,baskets:f.eggBaskets,bea:{phase:f.neighbors.bea.current?.phase,food:f.neighbors.bea.current?.food?.id,completed:f.neighbors.bea.completed,help:f.neighbors.bea.helpReady},mealOn:f.village.mealOn,meals:f.village.meals})}
document.getElementById('fixture').addEventListener('click',()=>{if(!allowed)return;document.getElementById('frame').innerHTML='';const {farm}=neighborTastingsFixture();localStorage.removeItem('cozy-farm-community-selection-v1');localStorage.setItem(farmSaveKeys.primary,JSON.stringify(farm));show(farm)})
document.getElementById('inspect').addEventListener('click',()=>{if(!allowed)return;const f=restoreFarm(JSON.parse(localStorage.getItem(farmSaveKeys.primary)??'null'));if(f)show(f);else out.textContent='Нет корректного сохранения.'})
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{if(!allowed)return;const [w,h]=b.dataset.size.split(',');document.getElementById('frame').innerHTML=`<iframe title="Игра" src="/" width="${w}" height="${h}"></iframe>`}))
</script></html>
