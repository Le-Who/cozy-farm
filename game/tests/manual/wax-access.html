<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Путь к пчелиному воску</title><h1>Путь к пчелиному воску</h1><p>Только loopback:5216. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm}from'/src/farm.ts';import{waxAccessFixture}from'../fixtures/wax-access.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5216',out=document.querySelector('pre'),baseline='cozy-wax-access-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),onlyIslandChanged:raw===JSON.stringify({...JSON.parse(localStorage.getItem(baseline)),island:f.island}),day:f.day,island:f.island,coins:f.coins,work:f.workToday,capeLevel:f.capeLevel,honey:f.honey,beeswax:f.beeswax,capeHoneyOn:f.capeHoneyOn,flowers:f.capeFlowers,musicLevel:f.musicGarden.level},null,2):'Нет корректной фермы.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const raw=JSON.stringify(waxAccessFixture());localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
