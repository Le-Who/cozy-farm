<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Развитие после гавани</title>
<style>body{font:16px/1.5 system-ui;background:#faf7f0;color:#352447;padding:16px}button{padding:10px;margin:4px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #999}</style>
<h1>Лавка и личное угощение после открытия гавани</h1><p>Чистая ферма пройдена настоящими доменными действиями. Запись только на localhost:4237.</p>
<button id="seed">Новая гавань, два соседа, день 14</button><button id="recipe">Яблоко и груша для рецепта</button><button id="inspect">Проверить сохранение</button><button id="reload">Перезагрузить игру</button><button data-size="568,320">568 × 320</button><button data-size="960,600">960 × 600</button><details><summary>Состояние</summary><pre id="result"></pre></details><iframe title="Игра для проверки" width="960" height="600"></iframe>
<script type="module">
import * as F from '/src/farm.ts';import * as H from '/src/harbour-economy.ts';import actions from '/tests/fixtures/home-progress-actions.json';import {farmSaveKeys} from '/src/farm-save-keys.ts';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4237';
function inspect(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&F.restoreFarm(JSON.parse(raw));result.textContent=JSON.stringify({valid:!!f,day:f?.day,coins:f?.coins,island:f?.island,recipes:f?.culinary.recipes,recipeStock:f?.culinary.stock,shop:f?.bayShop},null,2)}
function seed(recipe=false){if(!allowed)return;try{let f=F.createFarm();for(const action of actions){const r=(F[action.name]??H[action.name])(f,...action.args);if(!r.ok)throw Error(action.name+': '+r.message);f=F.restoreFarm(JSON.parse(JSON.stringify(f)))}if(recipe)for(const [name,...args] of [['sail','home'],['pickFruit',0],['sail','grove'],['pickFruit',0],['sail','village']]){const r=F[name](f,...args);if(!r.ok)throw Error(r.message)}f.discoveryPreferences.quiet=true;localStorage.setItem(farmSaveKeys.primary,JSON.stringify(f));inspect();frame.src='/'}catch(error){result.textContent=String(error);document.querySelector('details').open=true}};
document.querySelector('#seed').onclick=()=>seed();document.querySelector('#recipe').onclick=()=>seed(true);document.querySelector('#inspect').onclick=inspect;document.querySelector('#reload').onclick=()=>frame.src='/';document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h});if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);inspect();
</script></html>
