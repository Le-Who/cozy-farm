<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Припасы раннего рейса</title>
<style>body{font:16px/1.5 system-ui;padding:20px;background:#faf7f0;color:#352447}button{padding:10px;margin:5px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #999}</style>
<h1>Ферма → торговля → разведка</h1><p>Синтетическая ферма. Запись разрешена только на отдельном localhost:4235.</p>
<button data-fixture="boat">Лодка куплена, 0 монет</button><button data-fixture="short">Не хватает одной пшеницы</button><button data-fixture="watered">Пшеница уже полита</button><button data-fixture="salt">Маяк открыт, свои семена</button>
<button id="inspect">Проверить сохранение</button><button id="remember">Запомнить состояние</button><button id="reload">Перезагрузить игру</button>
<button data-size="390,844">390 × 844</button><button data-size="360,640">360 × 640</button><button data-size="568,320">568 × 320</button><button data-size="844,390">844 × 390</button><button data-size="1280,900">1280 × 900</button>
<details><summary>Состояние сохранения</summary><pre id="result"></pre></details><iframe title="Игра для проверки" width="390" height="844"></iframe>
<script type="module">
import {createFarm,restoreFarm,endDay,workBed,sellMarketItem,buyBoat} from '/src/farm.ts'
import {sendFerryExpedition,receiveFerryExpedition} from '/src/harbour-economy.ts'
import {farmSaveKeys} from '/src/farm-save-keys.ts'
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4235'
const result=document.querySelector('#result'),frame=document.querySelector('iframe')
if(!allowed){result.textContent='Запись запрещена вне localhost:4235';document.querySelectorAll('button').forEach(b=>b.disabled=true)}
function inspect(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));result.textContent=JSON.stringify({valid:!!f,unchanged:raw===sessionStorage.getItem('supplies-baseline'),day:f?.day,island:f?.island,coins:f?.coins,work:f?.workToday,wheat:f?.produce.wheat,carrot:f?.produce.carrot,seeds:f?.seeds.wheat,water:f?.water,beds:f?.beds,discovered:f?.freight.expeditions.discovered,voyage:f?.freight.expeditions.active,completed:f?.freight.expeditions.completed},null,2)}
function seed(kind){if(!allowed)return;let f=createFarm();f.discoveryPreferences.quiet=true;const act=result=>{if(!result.ok)throw new Error(result.message)};act(workBed(f,2));act(sellMarketItem(f,'produce:cabbage',2));act(buyBoat(f));if(kind!=='boat')act(workBed(f,4));if(['watered','salt'].includes(kind))act(workBed(f,11));if(kind==='salt'){act(endDay(f));act(workBed(f,11));for(const id of ['mill-grain','explore-salt']){act(sendFerryExpedition(f,id));act(endDay(f));act(receiveFerryExpedition(f));f=restoreFarm(f)}}f=restoreFarm(f);if(!f)throw new Error('Invalid fixture');const raw=JSON.stringify(f);localStorage.setItem(farmSaveKeys.primary,raw);sessionStorage.setItem('supplies-baseline',raw);inspect();frame.src='/'}
document.querySelectorAll('[data-fixture]').forEach(b=>b.onclick=()=>seed(b.dataset.fixture))
document.querySelector('#inspect').onclick=inspect
document.querySelector('#remember').onclick=()=>{if(!allowed)return;sessionStorage.setItem('supplies-baseline',localStorage.getItem(farmSaveKeys.primary));inspect()}
document.querySelector('#reload').onclick=()=>{frame.src='/'}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;if(!frame.src)frame.src='/'})
inspect()
</script></html>
