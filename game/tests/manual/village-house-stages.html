<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обживаемая гавань</title>
<style>body{font:15px/1.4 system-ui;background:#faf7f0;color:#352447;margin:10px}button{padding:8px;margin:3px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #999}</style>
<header><p>Визуальная проверка гавани: localhost:4241. Все состояния пройдены публичными действиями с чистой фермы.</p>
<button data-stage="0">Перед первым ужином</button><button data-stage="1">Перед вторым ужином</button><button data-stage="2">Второй дом готов</button><button data-stage="3">Два соседа</button><button id="inspect">Проверить запись</button><button id="reload">Перезагрузить</button><button data-size="390,844">390×844</button><button data-size="844,390">844×390</button><button data-size="960,600">960×600</button><button id="only-game">Только игра</button><details><summary>Состояние</summary><pre id="result"></pre></details></header><button id="show-controls" style="position:fixed;right:10px;top:10px" hidden>Проверки</button><iframe title="Игра для проверки" width="960" height="600"></iframe>
<script type="module">
import {commissionPlayer} from '/tests/fixtures/commission-player.ts';import actions from '/tests/fixtures/home-progress-actions.json';import {farmSaveKeys} from '/src/farm-save-keys.ts';import {restoreCurrentFarm,getVillageHomeCount} from '/src/farm.ts';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4241';const meals=actions.flatMap((a,i)=>a.name==='serveVillageMeal'?[i]:[]);
function inspect(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreCurrentFarm(JSON.parse(raw));result.textContent=JSON.stringify({valid:!!f,day:f?.day,homes:f&&getVillageHomeCount(f),village:f?.village},null,2)}
for(const button of document.querySelectorAll('[data-stage]'))button.onclick=()=>{if(!allowed)return;try{const stage=Number(button.dataset.stage),end=stage===0?meals[0]:stage===1?meals[1]:stage===2?meals[1]+1:actions.length,p=commissionPlayer(actions.slice(0,end));p.state.discoveryPreferences.quiet=true;localStorage.removeItem(farmSaveKeys.journal);localStorage.setItem(farmSaveKeys.primary,JSON.stringify(p.state));frame.src='/';inspect()}catch(e){result.textContent=String(e)}};
document.querySelector('#inspect').onclick=inspect;document.querySelector('#reload').onclick=()=>frame.src='/';document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h});if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
document.querySelector('#only-game').onclick=()=>{document.querySelector('header').hidden=true;document.querySelector('#show-controls').hidden=false};document.querySelector('#show-controls').onclick=()=>{document.querySelector('header').hidden=false;document.querySelector('#show-controls').hidden=true};
</script></html>
