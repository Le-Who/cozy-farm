<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Проверка следующего заказа</title><h1>Проверка следующего заказа</h1><p>Только loopback:5206. Существующие сохранения не заменяются.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/market-return-mobile.html">Открыть экран 390</a><button id="baseline">Запомнить состояние для проверки</button><button id="inspect">Прочитать состояние</button><pre role="status" id="result">Сохранение не изменено.</pre><script type="module">
import{createFarm,restoreFarm,getMarketOrders}from'/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';const baseline='cozy-market-return-baseline';const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5206',out=document.querySelector('#result');if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,coins:f.coins,work:f.workToday,progress:f.progress,produce:f.produce,order:getMarketOrders(f).find(o=>o.lane==='garden'),ledger:f.orders.garden},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Существующее сохранение не заменено.';return;}const f=createFarm();f.produce.cabbage=2;f.produce.tomato=1;f.orientation={collections:true,islands:true};f.discoveryPreferences.quiet=true;const checked=restoreFarm(f);if(!checked)throw Error('Некорректная ферма');localStorage.setItem(farmSaveKeys.primary,JSON.stringify(checked));show()};document.querySelector('#baseline').onclick=()=>{if(!allowed)return;const raw=localStorage.getItem(farmSaveKeys.primary);if(raw&&!localStorage.getItem(baseline)){localStorage.setItem(baseline,raw);show()}};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};</script></html>
