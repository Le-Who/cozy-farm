<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастерская: читаемые инструменты</title>
<style>body{font:14px/1.4 system-ui;background:#faf7f0;color:#352447;margin:8px}button{margin:3px;padding:8px}iframe{display:block;border:1px solid #aaa}pre{white-space:pre-wrap}</style>
<button data-size="360,640">360 × 640</button><button data-size="390,844">390 × 844</button><button data-size="568,320">568 × 320</button><button data-size="844,390">844 × 390</button><button data-size="520,480">520 × 480</button><button data-size="1120,760">1120 × 760</button><button id="inspect">Проверить элементы</button>
<p>Настоящая мастерская, без сохранений и расхода продуктов. Замесите тесто в миске, проверьте каждый инструмент, выбранный режим и сворачивание палитры. Выпечка только отмечает callback.</p><details><summary>Измерения элементов</summary><pre role="status" id="result">Сохранения не используются.</pre></details><iframe title="Настоящая мастерская" width="1120" height="760"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result')
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4272'
function open(){frame.srcdoc=`<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff0df}</style><div id="host"></div><script type="module">import {createWorkshop} from '/src/workshop.ts'; let bakes=0; const controller=createWorkshop(document.querySelector('#host'),{recipe:'bread',onBake(){parent.document.querySelector('#result').textContent='Callback выпечки: '+(++bakes);return true},onCancel(){controller.destroy();parent.document.querySelector('#result').textContent='Мастерская закрыта без записи сохранений.'}});<\/script></html>`}
function inspect(){const d=frame.contentDocument,root=d.querySelector('.dough-workshop');if(!root)return;const hand=d.querySelector('[data-prop=hand]').getBoundingClientRect(),palette=d.querySelector('.workshop-hand-menu'),bake=d.querySelector('.workshop-bake').getBoundingClientRect(),bounds=root.getBoundingClientRect(),guide=d.querySelector('.workshop-mode'),gr=guide.getBoundingClientRect();const tools=[...d.querySelectorAll('[data-tool]')].map(b=>{const r=b.getBoundingClientRect(),s=frame.contentWindow.getComputedStyle(b.querySelector('span'));return{mode:b.dataset.tool,selected:b.getAttribute('aria-pressed'),width:r.width,height:r.height,font:s.fontSize,atLeastHand:palette.hidden||r.width>=hand.width&&r.height>=hand.height,within:palette.hidden||r.left>=bounds.left&&r.right<=bounds.right&&r.top>=bounds.top&&r.bottom<=bounds.bottom,bakeOverlap:!palette.hidden&&r.left<bake.right&&r.right>bake.left&&r.top<bake.bottom&&r.bottom>bake.top}});out.textContent=JSON.stringify({stage:root.dataset.stage,mode:root.dataset.tool,paletteHidden:palette.hidden,guide:guide.textContent,guideWithin:gr.left>=bounds.left&&gr.right<=bounds.right&&gr.top>=bounds.top&&gr.bottom<=bounds.bottom,hand:{width:hand.width,height:hand.height},tools},null,2);console.info(out.textContent)}
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='Стенд доступен только на localhost:4272.'}else{open();document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h});document.querySelector('#inspect').onclick=inspect}
</script></html>
