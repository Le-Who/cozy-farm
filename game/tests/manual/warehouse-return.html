<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка возврата запасов</title><h1>Проверка возврата запасов</h1><p>Только loopback:5205. Существующие сохранения не заменяются.</p><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/warehouse-return-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><pre id="result" role="status">Сохранение не изменено.</pre><script type="module">
import{createFarm,restoreFarm}from'/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';import{getRequirementHint}from'/src/requirement-guidance.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5205',out=document.querySelector('#result'),baseline='cozy-warehouse-return-baseline';if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const expected=JSON.parse(localStorage.getItem(baseline)||'null');if(expected){expected.produce.wheat+=1;expected.freight.warehouses.home.wheat-=1;}const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),onlyOneWheatTransferred:raw===JSON.stringify(expected),day:f.day,coins:f.coins,work:f.workToday,progress:f.progress,wheat:f.produce.wheat,warehouse:f.freight.warehouses.home,dishes:f.dishes,signatureStock:f.culinary.stock,hint:getRequirementHint(f,{kind:'stock',item:{kind:'produce',item:'wheat',quantity:1}})},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').onclick=()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Существующее сохранение не заменено.';return;}const f=createFarm();f.boatOwned=true;f.buildingLevels.farmhouse=2;f.fruit.apple=2;f.eggs=1;f.beds=f.beds.map(b=>b.kind==='crop'&&b.crop==='wheat'?{kind:'tilled'}:b);f.freight.warehouses.home.wheat=2;f.orientation={collections:true,islands:true};f.discoveryPreferences.quiet=true;const checked=restoreFarm(f);if(!checked)throw Error('Некорректная ферма');const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show();};document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
