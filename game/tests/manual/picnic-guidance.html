<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка эффекта пикника</title>
<style>body{max-width:720px;margin:32px auto;padding:16px;font:17px/1.5 system-ui;background:#faf7f0;color:#352447}button,a{padding:12px;margin:5px;font:inherit;display:inline-block}pre{white-space:pre-wrap;padding:16px;background:white}</style>
<h1>Проверка эффекта пикника</h1><p>Синтетическая ферма только на localhost:5198. Создание не заменяет существующее сохранение.</p>
<label>Эффект <select id="processing"><option value="chunky">Урожай с грядки</option><option value="silky">Готовка</option><option value="bright">Рыбалка</option></select></label><button id="create">Создать проверочную ферму</button><a href="/">Открыть игру</a><a href="/scripts/qa/picnic-guidance-mobile.html">Открыть экран 390</a><button id="inspect">Прочитать проверочное состояние</button><button id="baseline">Запомнить состояние для сравнения</button><pre id="result" role="status">Сохранение не изменено.</pre>
<script type="module">
import {createFarm,restoreFarm,completeSignature,repeatSignature} from '/src/farm.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['127.0.0.1','localhost'].includes(location.hostname)&&location.port==='5198',output=document.querySelector('#result'),baseline='cozy-picnic-baseline';
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);output.textContent='Проверка разрешена только на localhost:5198.';}
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),farm=raw&&restoreFarm(JSON.parse(raw));output.textContent=farm?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:farm.day,coins:farm.coins,workToday:farm.workToday,progress:farm.progress,fishCaughtToday:farm.fishCaughtToday,fish:farm.fish,quiet:farm.discoveryPreferences.quiet,picnic:farm.culinary.picnic,stock:farm.culinary.stock,fruit:farm.fruit,produce:farm.produce,beds:farm.beds},null,2):'Нет корректного сохранения.';}
document.querySelector('#create').addEventListener('click',()=>{if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){output.textContent='Сохранение уже есть. Оно не заменено.';return;}const farm=createFarm();farm.day=5;farm.buildingLevels.farmhouse=2;farm.fruit.apple=20;farm.produce.wheat=10;farm.eggs=10;farm.beds=farm.beds.map(()=>({kind:'empty'}));farm.beds[0]={kind:'crop',crop:'carrot',growth:1,watered:false};farm.discoveryPreferences.quiet=true;farm.progress.harvest=1;const processing=document.querySelector('#processing').value;const made=completeSignature(farm,{base:'preserves',ingredients:[{id:'apple',quantity:2}]},{family:'preserves',processing,fruit:[{ingredientId:'apple',x:0,y:0,angle:0}],steps:['fruit','stir','jar']});if(!made.ok||!repeatSignature(farm,made.recipeId).ok||!restoreFarm(farm))throw Error('Некорректная проверочная ферма');const raw=JSON.stringify(farm);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show();});
document.querySelector('#inspect').addEventListener('click',()=>{if(allowed)show();});document.querySelector('#baseline').addEventListener('click',()=>{if(!allowed)return;const raw=localStorage.getItem(farmSaveKeys.primary);if(raw)localStorage.setItem(baseline,raw);show();});
</script></html>
