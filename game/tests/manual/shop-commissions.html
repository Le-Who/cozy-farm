<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Постоянные заказы лавки</title>
<style>body{font:15px/1.4 system-ui;background:#faf7f0;color:#352447;margin:10px}button{padding:8px;margin:3px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #999}</style>
<p>Тестовая гавань: только localhost:4238. Все припасы заработаны действиями с чистой фермы.</p>
<button id="offer">Покупка Беа + 2 порции</button><button id="empty">До покупки</button><button id="inspect">Проверить запись</button><button id="reload">Перезагрузить</button><button data-size="360,640">360×640</button><button data-size="520,480">520×480</button><button data-size="568,320">568×320</button><button data-size="960,600">960×600</button><details id="data"><summary>Состояние</summary><pre id="result"></pre></details><iframe title="Игра для проверки" width="960" height="600"></iframe>
<script type="module">
import {commissionPlayer} from '/tests/fixtures/commission-player.ts';import actions from '/tests/fixtures/home-progress-actions.json';import {farmSaveKeys,recoveredFarmSaveKeys} from '/src/farm-save-keys.ts';import {restoreCurrentFarm} from '/src/farm.ts';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='4238';
function inspect(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreCurrentFarm(JSON.parse(raw));result.textContent=JSON.stringify({valid:!!f,day:f?.day,coins:f?.coins,island:f?.island,recipeStock:f?.culinary.stock,warehouse:f?.freight.warehouses.village,commissions:f?.shopCommissions,legacyIntact:localStorage.getItem(recoveredFarmSaveKeys.primary)!==null},null,2)}
function seed(bought){if(!allowed)return;try{const p=commissionPlayer(actions),id=p.cook();if(bought){p.shelf(id);p.sale();p.cook(id);p.cook(id);p.act('transferBayGoods','deposit','village',`signature:${id}`,1)}p.state.discoveryPreferences.quiet=true;const f=structuredClone(p.state);delete f.shopCommissions;localStorage.removeItem(farmSaveKeys.primary);localStorage.removeItem(farmSaveKeys.journal);localStorage.setItem(recoveredFarmSaveKeys.primary,JSON.stringify(f));frame.src='/';result.textContent='Загрузка прежнего сохранения без нового поля…'}catch(error){result.textContent=String(error);document.querySelector('#data').open=true}}
document.querySelector('#offer').onclick=()=>seed(true);document.querySelector('#empty').onclick=()=>seed(false);document.querySelector('#inspect').onclick=inspect;document.querySelector('#reload').onclick=()=>frame.src='/';document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h});if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
</script></html>
