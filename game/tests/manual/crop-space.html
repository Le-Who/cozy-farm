<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Место для нужной культуры</title><h1>Место для нужной культуры</h1><p>Только loopback:5222. Существующая ферма не заменяется.</p><button id="create">Создать проверочную ферму</button><button id="after-rest">Создать ферму после отдыха</button><a href="/">Открыть игру</a><button id="inspect">Проверить сохранение</button><pre role="status">Сохранение не изменено.</pre><script type="module">
import{restoreFarm,endDay}from'/src/farm.ts';import{cropSpaceFixture}from'../fixtures/crop-space.ts';import{farmSaveKeys}from'/src/farm-save-keys.ts';
const allowed=['localhost','127.0.0.1'].includes(location.hostname)&&location.port==='5222',out=document.querySelector('pre'),baseline='cozy-crop-space-baseline';
if(!allowed)document.querySelectorAll('button').forEach(b=>b.disabled=true);
function show(){const raw=localStorage.getItem(farmSaveKeys.primary),f=raw&&restoreFarm(JSON.parse(raw));out.textContent=f?JSON.stringify({valid:true,saveBytesUnchanged:raw===localStorage.getItem(baseline),day:f.day,coins:f.coins,work:f.workToday,beds:f.beds,water:f.water,produce:f.produce,seeds:f.seeds,selectedSeed:f.selectedSeed,variants:f.variants,fruit:f.fruit,recipes:f.culinary.recipes.map(r=>({id:r.id,name:r.name,batches:r.batches})),stock:f.culinary.stock},null,2):'Нет корректной фермы.';}
function create(afterRest=false){if(!allowed)return;if(localStorage.getItem(farmSaveKeys.primary)||localStorage.getItem(farmSaveKeys.legacy)){out.textContent='Имеющаяся ферма не заменена.';return;}const checked=cropSpaceFixture();if(afterRest)endDay(checked);if(!restoreFarm(checked))throw Error("Некорректная ферма после отдыха");const raw=JSON.stringify(checked);localStorage.setItem(farmSaveKeys.primary,raw);localStorage.setItem(baseline,raw);show()};document.querySelector('#create').onclick=()=>create();document.querySelector('#after-rest').onclick=()=>create(true);document.querySelector('#inspect').onclick=()=>{if(allowed)show()};
</script></html>
